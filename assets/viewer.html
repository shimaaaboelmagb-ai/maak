<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f8f9fa; overflow: hidden; }
    canvas { display: block; }
    #overlay {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif; font-size: 15px; color: #666;
      text-align: center; pointer-events: none;
    }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="overlay">Loading model…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene ──────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f9fa);

    // ── Camera ─────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(
      40, window.innerWidth / window.innerHeight, 0.01, 100
    );
    camera.position.set(0, 0.9, 3.8);

    // ── Renderer ───────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ── Lights ─────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(1.5, 3, 2);
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8899ff, 0.6);
    fill.position.set(-2, 1, -1);
    scene.add(fill);

    // ── Orbit controls ─────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.9, 0);
    controls.minDistance = 0.5;
    controls.maxDistance = 12;
    controls.update();

    // ── Bone & skeleton cache ──────────────────────────────
    const boneMap       = {};   
    const skinnedMeshes = [];   
    const bindPoseQ     = {};   

    // ── Load GLB ───────────────────────────────────────────
    const overlay = document.getElementById('overlay');
    const loader  = new GLTFLoader();

    function restoreBindPose() {
      for (const [name, bone] of Object.entries(boneMap)) {
        if (bindPoseQ[name]) bone.quaternion.copy(bindPoseQ[name]);
      }
    }

    const _tmpEuler = new THREE.Euler();

    // 🛠️ [تعديل حرج لحل مشكلة رفع الأذرع]: ضبط المحاور والترتيب ليتناسب مع الموبايل والسيرفر معاً
    function applyBones(boneData) {
      for (const name in boneData) {
        const bone = boneMap[name];
        if (!bone) continue;
        
        const [p, h, r] = boneData[name];
        
        // تعديل الإشارات لمنع التداخل والارتفاع المفاجئ للكتف والدراع
        let corrected_X = p;   
        let corrected_Y = h;   
        let corrected_Z = -r;  

        // استخدام ترتيب دوران YXZ لمنع حدوث الـ Gimbal Lock في أذرع الموديل
        _tmpEuler.set(corrected_X, corrected_Y, corrected_Z, 'YXZ');
        bone.quaternion.setFromEuler(_tmpEuler);
      }

      for (const mesh of skinnedMeshes) {
        if (mesh.skeleton) mesh.skeleton.update();
      }
    }

    // ── Public API ─────────────────────────────────────────

    window.loadModelFromBase64 = function(b64) {
      overlay.textContent = 'Processing model…';
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

        const blobUrl = URL.createObjectURL(
          new Blob([bytes.buffer], { type: 'model/gltf-binary' })
        );

        loader.load(
          blobUrl,
          (gltf) => {
            URL.revokeObjectURL(blobUrl);
            scene.add(gltf.scene);
            gltf.scene.traverse(node => {
              if (node.isBone) {
                boneMap[node.name] = node;
                bindPoseQ[node.name] = node.quaternion.clone();
              }
              if (node.isSkinnedMesh) {
                node.frustumCulled = false;
                skinnedMeshes.push(node);
              }
            });
            overlay.classList.add('hidden');
          },
          (xhr) => {
            if (xhr.total > 0)
              overlay.textContent = 'Loading ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
          },
          (err) => {
            overlay.textContent = 'Error loading model';
          }
        );
      } catch (err) {
        overlay.textContent = 'Error processing model';
      }
    };

    window.playAnimation = function(framesJson) {
      const frames = JSON.parse(framesJson);
      if (!frames || frames.length === 0) return;

      const SPEED = 1.2;  
      let startTime = null;
      let lastIdx   = -1;

      function loop(ts) {
        if (!startTime) startTime = ts;
        const elapsed = (ts - startTime) / 1000 * SPEED;

        let idx = 0;
        for (let i = 0; i < frames.length; i++) {
          if (frames[i].time <= elapsed) idx = i;
          else break;
        }

        if (idx !== lastIdx) {
          applyBones(frames[idx].bones);
          lastIdx = idx;
        }

        if (elapsed < frames[frames.length - 1].time + 0.2) {
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    };

    window.resetPose = function() {
      restoreBindPose();
      for (const mesh of skinnedMeshes) {
        if (mesh.skeleton) mesh.skeleton.update();
      }
    };

    // ── Resize ─────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ────────────────────────────────────────
    function render() {
      requestAnimationFrame(render);
      controls.update();
      renderer.render(scene, camera);
    }
    render();
  </script>
</body>
</html>
