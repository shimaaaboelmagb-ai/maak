<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f8f9fa; overflow: hidden; }
    canvas { display: block; }
    #overlay {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif; font-size: 15px; color: #666;
      text-align: center; pointer-events: none;
    }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="overlay">Loading model…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene ──────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f9fa);

    // ── Camera ─────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(
      40, window.innerWidth / window.innerHeight, 0.01, 100
    );
    camera.position.set(0, 0.9, 3.8);

    // ── Renderer ───────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ── Lights ─────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(1.5, 3, 2);
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8899ff, 0.6);
    fill.position.set(-2, 1, -1);
    scene.add(fill);

    // ── Orbit controls ─────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.9, 0);
    controls.minDistance = 0.5;
    controls.maxDistance = 12;
    controls.update();

    // ── Bone & skeleton cache ──────────────────────────────
    const boneMap       = {};   // name → THREE.Bone
    const skinnedMeshes = [];   // THREE.SkinnedMesh[]
    const bindPoseQ     = {};   // name → THREE.Quaternion (bind pose, saved at load)

    // ── Load GLB ───────────────────────────────────────────
    const overlay = document.getElementById('overlay');
    const loader  = new GLTFLoader();

    // Model is loaded by Flutter calling window.loadModelFromBase64(b64)
    // after the page is ready (avoids file:// fetch restrictions)

    // ── Internal helpers ───────────────────────────────────

    // Restore every bone to its saved bind pose
    function restoreBindPose() {
      for (const [name, bone] of Object.entries(boneMap)) {
        if (bindPoseQ[name]) bone.quaternion.copy(bindPoseQ[name]);
      }
    }

    const _tmpEuler = new THREE.Euler();
    const _tmpQ     = new THREE.Quaternion();

    // Apply one frame — set animated bones directly, leave others untouched.
    // NO bind-pose restore: the developer designed the system to apply values
    // directly on top of whatever pose the bone is currently in.
    // Non-animated bones naturally keep their GLTF bind pose.
    function applyBones(boneData) {
      for (const name in boneData) {
        const bone = boneMap[name];
        if (!bone) continue;
        const [p, h, r] = boneData[name];
        // Direct mapping: p→X, h→Y, r→Z (degrees already converted to radians in Dart)
        _tmpEuler.set(p, h, r, 'XYZ');
        bone.quaternion.setFromEuler(_tmpEuler);
      }

      for (const mesh of skinnedMeshes) {
        if (mesh.skeleton) mesh.skeleton.update();
      }
    }

    // ── Public API (called from Flutter via runJavaScript) ──

    // Called once at startup: Flutter passes the GLB as base64
    window.loadModelFromBase64 = function(b64) {
      overlay.textContent = 'Processing model…';
      try {
        // base64 → Uint8Array → Blob → object URL (bypasses file:// restriction)
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

        const blobUrl = URL.createObjectURL(
          new Blob([bytes.buffer], { type: 'model/gltf-binary' })
        );

        loader.load(
          blobUrl,
          (gltf) => {
            URL.revokeObjectURL(blobUrl);
            scene.add(gltf.scene);
            gltf.scene.traverse(node => {
              if (node.isBone) {
                boneMap[node.name] = node;
                // Save bind pose quaternion so we can restore it every frame
                bindPoseQ[node.name] = node.quaternion.clone();
              }
              if (node.isSkinnedMesh) {
                node.frustumCulled = false;
                skinnedMeshes.push(node);
              }
            });
            overlay.classList.add('hidden');
            console.log('[viewer] bones=' + Object.keys(boneMap).length +
                        ' meshes=' + skinnedMeshes.length);
          },
          (xhr) => {
            if (xhr.total > 0)
              overlay.textContent = 'Loading ' +
                Math.round(xhr.loaded / xhr.total * 100) + '%';
          },
          (err) => {
            overlay.textContent = 'Error loading model';
            console.error('[viewer] load error', err);
          }
        );
      } catch (err) {
        overlay.textContent = 'Error processing model';
        console.error('[viewer] base64 error', err);
      }
    };

    window.playAnimation = function(framesJson) {
      const frames = JSON.parse(framesJson);
      if (!frames || frames.length === 0) return;

      const SPEED = 1.5;  

      let startTime = null;
      let lastIdx   = -1;

      function loop(ts) {
        if (!startTime) startTime = ts;
        const elapsed = (ts - startTime) / 1000 * SPEED;

        // Binary-search the latest frame whose time ≤ elapsed
        let idx = 0;
        for (let i = 0; i < frames.length; i++) {
          if (frames[i].time <= elapsed) idx = i;
          else break;
        }

        if (idx !== lastIdx) {
          applyBones(frames[idx].bones);
          lastIdx = idx;
        }

        if (elapsed < frames[frames.length - 1].time + 0.3) {
          requestAnimationFrame(loop);
        } else {
          console.log('[viewer] animation done, frames=' + (lastIdx + 1));
        }
      }

      requestAnimationFrame(loop);
    };

    // Reset = go back to bind pose (NOT to zero!)
    // Reset camera to front view
    window.resetCamera = function() {
      camera.position.set(0, 0.9, 3.8);
      controls.target.set(0, 0.9, 0);
      controls.update();
    };

    window.resetPose = function() {
      restoreBindPose();
      for (const mesh of skinnedMeshes) {
        if (mesh.skeleton) mesh.skeleton.update();
      }
    };

    window.listBones = function() {
      const names = Object.keys(boneMap);
      console.log('[viewer] === BONES (' + names.length + ') ===');
      names.forEach(n => console.log('  -', n));
    };

    // ── Diagnostic tools ──────────────────────────────────

    // Send message back to Flutter (shown as a dialog)
    function toFlutter(msg) {
      if (window.FlutterDebug) window.FlutterDebug.postMessage(msg);
      console.log('[debug]', msg);
    }

    // Check if bones have non-zero rest pose (would break direct set())
    window.checkRestPose = function() {
      let lines = [];
      let nonZero = 0;
      Object.entries(boneMap).forEach(([name, bone]) => {
        const r = bone.rotation;
        const rx = (r.x * 180 / Math.PI).toFixed(1);
        const ry = (r.y * 180 / Math.PI).toFixed(1);
        const rz = (r.z * 180 / Math.PI).toFixed(1);
        if (Math.abs(r.x) > 0.01 || Math.abs(r.y) > 0.01 || Math.abs(r.z) > 0.01) {
          lines.push(name + '\n  x=' + rx + '° y=' + ry + '° z=' + rz + '°');
          nonZero++;
        }
      });
      const total = Object.keys(boneMap).length;
      const summary = 'Non-zero rest bones: ' + nonZero + ' / ' + total + '\n\n' + lines.join('\n');
      toFlutter(summary);
    };

    // Quick hello test with different axis mappings — find which one looks right
    window.testHelloMapping = function(mapping) {
      restoreBindPose();
      const DEG = Math.PI / 180;
      // hello data: RightArm{h=-20,p=65,r=0}, RightForeArm{h=0,p=0,r=30}, RightHand{h=50,p=0,r=0}
      const data = {
        'mixamorig10RightArm':    { h:-20*DEG, p:65*DEG,  r:0 },
        'mixamorig10RightForeArm':{ h:0,       p:0,       r:30*DEG },
        'mixamorig10RightHand':   { h:50*DEG,  p:0,       r:0 }
      };
      for (const name in data) {
        const bone = boneMap[name];
        if (!bone) continue;
        const d = data[name];
        let x, y, z;
        switch (mapping) {
          case 'p,h,r':    x= d.p; y= d.h; z= d.r; break;  // current
          case '-p,h,r':   x=-d.p; y= d.h; z= d.r; break;  // negate pitch only
          case '-p,-h,r':  x=-d.p; y=-d.h; z= d.r; break;  // negate pitch+heading
          case 'p,-h,r':   x= d.p; y=-d.h; z= d.r; break;  // negate heading only
          case '-p,-h,-r': x=-d.p; y=-d.h; z=-d.r; break;  // negate all
          case 'r,h,p':    x= d.r; y= d.h; z= d.p; break;  // swap p/r
          default: return;
        }
        _tmpEuler.set(x, y, z, 'XYZ');
        bone.quaternion.setFromEuler(_tmpEuler);
      }
      skinnedMeshes.forEach(m => { if (m.skeleton) m.skeleton.update(); });
      toFlutter('Mapping: ' + mapping + '\nWatch the right arm — should raise UP toward camera for hello wave');
    };

    // Test ONE bone with direct X/Y/Z values — call from Flutter console:
    // window.testBone('mixamorig10RightArm', 90, 0, 0)  → should raise arm if X is correct
    // window.testBone('mixamorig10RightArm', 0, 90, 0)  → test Y axis
    // window.testBone('mixamorig10RightArm', 0, 0, 90)  → test Z axis
    window.testBone = function(boneName, xDeg, yDeg, zDeg) {
      restoreBindPose();
      skinnedMeshes.forEach(m => { if (m.skeleton) m.skeleton.update(); });
      const bone = boneMap[boneName];
      if (!bone) { toFlutter('Bone not found: ' + boneName); return; }
      bone.rotation.set(
        xDeg * Math.PI / 180,
        yDeg * Math.PI / 180,
        zDeg * Math.PI / 180
      );
      skinnedMeshes.forEach(m => m.skeleton.update());
      toFlutter('Applied to ' + boneName + ':\nX=' + xDeg + '°  Y=' + yDeg + '°  Z=' + zDeg + '°\n\nWatch how the arm moved!');
    };

    // Try all 6 axis combinations for h/p/r mapping (call and observe which looks correct)
    window.testMapping = function(boneName, hDeg, pDeg, rDeg) {
      const toR = d => d * Math.PI / 180;
      const h = toR(hDeg), p = toR(pDeg), r = toR(rDeg);
      const mappings = {
        'p,h,r (current)': [p, h, r],
        'h,p,r':           [h, p, r],
        'r,h,p':           [r, h, p],
        'h,r,p':           [h, r, p],
        'p,r,h':           [p, r, h],
        'r,p,h':           [r, p, h],
      };
      console.log('[mapping] Testing bone: ' + boneName +
                  ' h=' + hDeg + ' p=' + pDeg + ' r=' + rDeg);
      console.log('[mapping] Call window.applyMapping(boneName, mappingName) to test each');
      window._lastMappings = { boneName, mappings };
      Object.keys(mappings).forEach(k => console.log('  → ' + k));
    };

    window.applyMapping = function(boneName, mappingName) {
      if (!window._lastMappings) { console.error('Call testMapping first'); return; }
      window.resetPose();
      const bone = boneMap[boneName];
      if (!bone) { console.error('Bone not found: ' + boneName); return; }
      const m = window._lastMappings.mappings[mappingName];
      if (!m) { console.error('Unknown mapping: ' + mappingName); return; }
      bone.rotation.set(m[0], m[1], m[2]);
      skinnedMeshes.forEach(ms => ms.skeleton.update());
      console.log('[mapping] Applied: ' + mappingName);
    };

    // ── Resize ─────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop (always running, no idle pausing) ──────
    function render() {
      requestAnimationFrame(render);
      controls.update();
      renderer.render(scene, camera);
    }
    render();
  </script>
</body>
</html>
